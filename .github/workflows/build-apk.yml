name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: final-output
        run: npm install --ignore-engines

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Licenses and Check Platforms
        run: |
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-35" || true
          fi

      - name: Prepare gradlew script
        run: |
          sed -i 's/\r$//' ./final-output/android/gradlew
          chmod +x ./final-output/android/gradlew

      - name: Build APK with Gradle
        working-directory: ./final-output/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../gradle.log

      - name: Locate Built APK Files
        run: |
          echo "=== Found APK files ==="
          find . -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: honest-app-debug-apk
          path: '**/*.apk'
          if-no-files-found: error
          retention-days: 14
