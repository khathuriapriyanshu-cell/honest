name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: final-output
        run: npm install --ignore-engines

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Licenses and Install SDK 36
        run: |
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" || true
          fi

      - name: Prepare gradlew script
        run: |
          sed -i 's/\r$//' ./final-output/android/gradlew
          chmod +x ./final-output/android/gradlew

      - name: Build APK with Gradle
        working-directory: ./final-output/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1

      - name: Save Build Error Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B ci-error-log
          cp final-output/android/build.log ./build-error.log
          git add build-error.log
          git commit -m "chore: save build-error.log"
          git push -f origin ci-error-log

      - name: Find and Copy APK to Root
        run: |
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in build outputs."
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" ./honest-app-debug.apk
          ls -lh ./honest-app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: honest-app-debug-apk
          path: ./honest-app-debug.apk
          if-no-files-found: error
          retention-days: 14
