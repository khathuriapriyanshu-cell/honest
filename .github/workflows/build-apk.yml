name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Sync Capacitor
        working-directory: final-output
        run: |
          npm install
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android Platforms & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Prepare gradlew script
        run: |
          sed -i 's/\r$//' ./final-output/android/gradlew
          chmod +x ./final-output/android/gradlew

      - name: Build APK with Gradle
        working-directory: ./final-output/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../gradle.log

      - name: Report Build Error on Failure
        if: failure()
        run: |
          if [ -f gradle.log ]; then
            echo "### ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 gradle.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: honest-app-debug-apk
          path: ./final-output/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
