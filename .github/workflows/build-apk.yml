name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Detect Android Project Path
        id: find_path
        run: |
          if [ -d "final-output/android" ]; then
            echo "dir=final-output/android" >> $GITHUB_OUTPUT
          elif [ -d "android" ]; then
            echo "dir=android" >> $GITHUB_OUTPUT
          else
            echo "Android directory not found"
            exit 1
          fi

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fix line endings and grant execute permission
        run: |
          sed -i 's/\r$//' ./${{ steps.find_path.outputs.dir }}/gradlew
          chmod +x ./${{ steps.find_path.outputs.dir }}/gradlew

      - name: Build APK with Gradle
        working-directory: ./${{ steps.find_path.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: honest-app-debug-apk
          path: ${{ steps.find_path.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
